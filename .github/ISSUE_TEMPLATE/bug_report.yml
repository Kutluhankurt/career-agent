name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please remove any private window titles from logs before pasting.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 (X11) / macOS 15 / Windows 11"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: career version
      placeholder: "Career Agent v0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (~/.career-agent/logs/agent.log)
      render: text
