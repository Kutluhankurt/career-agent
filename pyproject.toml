[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-agent"
version = "0.1.0"
description = "Local-first AI career intelligence agent that turns daily work into a career record."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kutluhan Kurt" }]
keywords = ["career", "cv", "resume", "local-first", "ai", "productivity", "time-tracking", "developer-tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "psutil>=5.9",
    "tomli-w>=1.0",
    "keyring>=24.0",
    "httpx>=0.27",
    "watchdog>=6.0.0",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.9",
    "fastapi>=0.143.2",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Kutluhankurt/career-agent"
Issues = "https://github.com/Kutluhankurt/career-agent/issues"

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all-ai = ["anthropic>=1.0", "openai>=1.40", "google-genai>=1.0"]

[project.scripts]
career = "career.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/career"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not platform'"
markers = ["platform: tests that touch the real desktop of the current OS"]
